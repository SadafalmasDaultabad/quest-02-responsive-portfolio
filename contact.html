<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact me using the accessible contact form on my personal portfolio.">
    <title>Contact | Personal Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="script.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="index.html">
                <span class="brand-mark" aria-hidden="true">SD</span>
                <span class="brand-name">Sadafalmas Daultabad</span>
            </a>

            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>

            <button class="theme-toggle" type="button" aria-pressed="false">
                <span class="visually-hidden">Dark mode</span>
                <svg class="icon icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="icon icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </div>
    </header>

    <main id="main-content">
        <section class="page-hero reveal" aria-labelledby="contact-title">
            <p class="eyebrow">Contact</p>
            <h1 id="contact-title">Contact <span class="text-gradient">Me</span></h1>
        </section>

        <section class="contact-grid" aria-labelledby="contact-heading">
            <div class="contact-intro reveal">
                <span class="project-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg>
                </span>
                <h2 id="contact-heading">Get in Touch</h2>
                <p>Fill out the form below to send a message.</p>
            </div>

            <div class="contact-wrap reveal reveal-2">
                <div class="contact-card">
                    <form action="#" method="post" aria-label="Contact form">
                        <div class="form-grid">
                            <div class="field">
                                <label for="name">Full Name</label>
                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    autocomplete="name"
                                    required
                                >
                            </div>

                            <div class="field">
                                <label for="email">Email Address</label>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    autocomplete="email"
                                    required
                                >
                            </div>

                            <div class="field field-wide">
                                <label for="subject">Subject</label>
                                <input
                                    type="text"
                                    id="subject"
                                    name="subject"
                                    required
                                >
                            </div>

                            <div class="field field-wide">
                                <label for="message">Your Message</label>
                                <textarea
                                    id="message"
                                    name="message"
                                    rows="5"
                                    required
                                ></textarea>
                            </div>

                            <div class="form-actions field-wide">
                                <button class="btn btn-primary" type="submit">Send Message</button>
                                <p class="form-note">All fields are required.</p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio. All rights reserved.</p>
    </footer>
</body>
</html>
